plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ble.rawreader'
    compileSdk 33

    defaultConfig {
        applicationId 'com.ble.rawreader'
        minSdk 26
        targetSdk 33
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        exclude 'META-INF/*.kotlin_module'
    }
}

dependencies {
    // 零第三方依赖：BLE 用系统 android.bluetooth.le，UI 用系统 View
    // 仅 Kotlin 标准库（AGP 不会自动附带，必须显式声明）
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
