# ---- 项目路径可能含非 ASCII 字符，需关闭 Gradle 的 ASCII 路径检查 ----
android.overridePathCheck=true

# ---- 不使用 AndroidX（本项目零第三方依赖，只用系统 API）----
android.useAndroidX=false
android.enableJetifier=false

# ---- 低内存环境（15G 内存 / 12 核）下的 Gradle 调优 ----
org.gradle.jvmargs=-Xmx1536m -XX:ActiveProcessorCount=2 -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -Xss512k -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=true
kotlin.compiler.execution.strategy=in-process

# ---- 网络超时：连不上的源快速失败，别干等 ----
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=15000
systemProp.org.gradle.internal.repository.max.retries=2
